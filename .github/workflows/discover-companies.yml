name: Discover India ATS companies

on:
  schedule:
    # UTC: 00:17, 05:17, 10:17, 15:17, 20:17 (four-hour overnight gap).
    - cron: '17 0,5,10,15,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discover-companies
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: pip install -r requirements.txt
      - name: Discover and verify boards
        env:
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
        run: python scripts/discover.py
      - name: Commit updated CSV files
        run: |
          git add companies.csv boards.csv discovery_state.json
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update verified India ATS companies'
          git push origin HEAD:${{ github.event.repository.default_branch }}
